<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chroma Note · 사용자 한 명, 여러 개의 선화 기록</title><style>*{box-sizing:border-box}body{margin:0;background:#F7F3EA;color:#292823;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}main{max-width:1360px;margin:auto;padding:36px 24px}h1{font-size:32px;margin:12px 0 24px;letter-spacing:-.04em}nav{display:flex;gap:24px;font-size:14px}a{color:#294B63}.canvas{overflow-x:auto}svg{display:block;width:100%;min-width:960px}@media print{nav{display:none}main{padding:0}svg{min-width:0}}</style></head><body><main><nav><a href="system-diagram.html">시스템 구조</a><a href="record-erd.html">데이터 관계</a><a href="chroma-note.dbml">전체 DBML</a></nav><h1>사용자 한 명, 여러 개의 선화 기록</h1><div class="canvas" tabindex="0" aria-label="다이어그램. 좁은 화면에서는 가로로 스크롤할 수 있습니다."><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 816" role="img" aria-labelledby="record-erd-title record-erd-desc"><title id="record-erd-title">사용자 한 명, 여러 개의 선화 기록</title><desc id="record-erd-desc">사용자와 선화 기록은 일대다 관계다. 삭제 표식은 사용자에 연결되며 계정 삭제 작업은 계정이 삭제된 후에도 남는다. 주요 데이터만 표시하며 전체 컬럼은 DBML에서 확인한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#294B63"/></marker></defs><rect width="1280" height="816" fill="#F7F3EA"/><path d="M368 240H624" fill="none" stroke="#294B63" stroke-width="1.5"/><text x="390" y="224" font-size="18" fill="#292823" font-weight="400" text-anchor="start">1</text><text x="566" y="224" font-size="18" fill="#292823" font-weight="400" text-anchor="start">0..N</text><text x="444" y="272" font-size="18" fill="#294B63" font-weight="400" text-anchor="start">기록 소유</text><g class="entity"><rect x="48" y="128" width="320" height="232" rx="8" fill="#FFFDFA" stroke="#B7AFA2"/><text x="72" y="166" font-size="23" fill="#292823" font-weight="600" text-anchor="start">사용자</text><text x="72" y="194" font-size="14" fill="#656158" font-weight="400" text-anchor="start">auth.users</text><text x="72" y="232" font-size="18" fill="#292823" font-weight="400" text-anchor="start">id  ·  사용자 ID / PK</text><text x="72" y="262" font-size="18" fill="#292823" font-weight="400" text-anchor="start">email  ·  로그인 이메일</text></g><g class="entity"><rect x="624" y="128" width="592" height="280" rx="8" fill="#E8EFF3" stroke="#294B63"/><text x="648" y="166" font-size="23" fill="#292823" font-weight="600" text-anchor="start">선화 기록</text><text x="648" y="194" font-size="14" fill="#656158" font-weight="400" text-anchor="start">public.stamp_records</text><text x="648" y="232" font-size="18" fill="#292823" font-weight="400" text-anchor="start">id  ·  기록 ID / PK</text><text x="648" y="262" font-size="18" fill="#292823" font-weight="400" text-anchor="start">user_id  ·  소유자 / FK</text><text x="648" y="292" font-size="18" fill="#292823" font-weight="400" text-anchor="start">선화 경로 · 메모 · 날짜 · 장소</text><text x="648" y="322" font-size="18" fill="#292823" font-weight="400" text-anchor="start">태그 · 대표색 · 저장 상태</text></g><text x="48" y="460" font-size="20" fill="#292823" font-weight="600" text-anchor="start">삭제 관리</text><path d="M208 360V492" fill="none" stroke="#294B63" stroke-width="1.5"/><text x="220" y="390" font-size="16" fill="#292823" font-weight="400" text-anchor="start">1</text><text x="220" y="480" font-size="16" fill="#292823" font-weight="400" text-anchor="start">0..N</text><text x="260" y="432" font-size="16" fill="#294B63" font-weight="400" text-anchor="start">계정 삭제 시 함께 삭제</text><g class="entity"><rect x="48" y="492" width="504" height="196" rx="8" fill="#FFFDFA" stroke="#B7AFA2"/><text x="72" y="530" font-size="23" fill="#292823" font-weight="600" text-anchor="start">기록 삭제 표식</text><text x="72" y="558" font-size="14" fill="#656158" font-weight="400" text-anchor="start">app_private.record_tombstones</text><text x="72" y="596" font-size="18" fill="#292823" font-weight="400" text-anchor="start">user_id + record_id  ·  복합 PK</text><text x="72" y="626" font-size="18" fill="#292823" font-weight="400" text-anchor="start">삭제된 기록 ID · 삭제 시각</text></g><g class="entity"><rect x="624" y="492" width="592" height="196" rx="8" fill="#FFFDFA" stroke="#B7AFA2"/><text x="648" y="530" font-size="23" fill="#292823" font-weight="600" text-anchor="start">계정 삭제 작업</text><text x="648" y="558" font-size="14" fill="#656158" font-weight="400" text-anchor="start">app_private.account_deletion_jobs</text><text x="648" y="596" font-size="18" fill="#292823" font-weight="400" text-anchor="start">user_id  ·  PK / FK 없음</text><text x="648" y="626" font-size="18" fill="#292823" font-weight="400" text-anchor="start">요청 시각 · 상태 · 오류 · 재시도 횟수</text></g><text x="648" y="724" font-size="16" fill="#656158" font-weight="400" text-anchor="start">계정 삭제 후에도 파일 정리 작업을 추적</text><text x="72" y="724" font-size="16" fill="#656158" font-weight="400" text-anchor="start">기록 삭제 후에도 표식을 보관 · record_id는 FK 없음</text><text x="48" y="784" font-size="16" fill="#656158" font-weight="400" text-anchor="start">실선 = 외래 키(FK) 관계     PK = 기본 키     0..N = 0개 이상</text></svg></div></main></body></html>
